[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-rootcause"
version = "0.1.0"
description = "Deterministic multi-agent CI root cause engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-adk==1.25.1",
]

[project.scripts]
ci-rootcause = "src.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests/unit", "tests/integration"]
markers = [
  "nondeterministic: marks tests that are intentionally non-deterministic",
  "live_github: marks tests that hit the real GitHub API and require explicit opt-in credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
