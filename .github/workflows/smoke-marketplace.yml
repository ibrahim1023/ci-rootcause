name: Smoke Test Marketplace Action

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  smoke-marketplace:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      SMOKE_CREATE_FIX_PR: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git identity for action-created commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Write canary file for fix synthesis
        run: |
          cat > typecheck_target.py <<'EOF'
          def sentinel_value() -> int:
              value: int = "7"
              return value
          EOF

      - name: Write validated changes payload
        run: |
          cat > validated-changes.json <<'EOF'
          [
            {
              "file": "typecheck_target.py",
              "content": "def sentinel_value() -> int:\n    value: int = 7\n    return value\n"
            }
          ]
          EOF

      - name: Write deterministic typecheck failure log
        run: |
          cat > ci-rootcause-smoke.log <<'EOF'
          ##[group]Run mypy
          typecheck_target.py:2: error: Incompatible types in assignment (ts2345)
          Found 1 error in 1 file (checked 1 source file)
          ##[endgroup]
          EOF

      - name: Write deterministic diff for ranker proximity
        run: |
          cat > ci-rootcause-smoke.diff <<'EOF'
          diff --git a/typecheck_target.py b/typecheck_target.py
          index 1111111..2222222 100644
          --- a/typecheck_target.py
          +++ b/typecheck_target.py
          @@ -1,3 +1,3 @@
           def sentinel_value() -> int:
          -    value: int = "7"
          +    value: int = 7
               return value
          EOF

      - name: Write smoke config
        run: |
          cat > .ci-rootcause-smoke.yml <<EOF
          repository: ${{ github.repository }}
          target_branch: ${{ github.ref_name }}
          run_id: marketplace-smoke-${{ github.run_id }}
          output_dir: artifacts
          log_path: ci-rootcause-smoke.log
          diff_path: ci-rootcause-smoke.diff
          validated_changes_path: validated-changes.json
          EOF

      - name: Preflight action input contract
        run: |
          echo "SMOKE_CREATE_FIX_PR=${SMOKE_CREATE_FIX_PR}"
          if [ "${SMOKE_CREATE_FIX_PR}" != "true" ]; then
            echo "Expected SMOKE_CREATE_FIX_PR=true before running action."
            exit 1
          fi

      - name: Run published ci-rootcause action
        id: rca
        uses: ibrahim1023/ci-rootcause-action@v0.1.7
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          INPUT_CREATE_FIX_PR: ${{ env.SMOKE_CREATE_FIX_PR }}
          CI_ROOTCAUSE_LOG_PATH: ci-rootcause-smoke.log
          CI_ROOTCAUSE_DIFF_PATH: ci-rootcause-smoke.diff
          CI_ROOTCAUSE_RAW_LOG: |
            ##[group]Run mypy
            typecheck_target.py:2: error: Incompatible types in assignment (ts2345)
            Found 1 error in 1 file (checked 1 source file)
            ##[endgroup]
        with:
          github_token: ${{ github.token }}
          create_fix_pr: ${{ env.SMOKE_CREATE_FIX_PR }}
          post_pr_comment: "false"
          config_path: .ci-rootcause-smoke.yml
          base_ref: ${{ github.sha }}
          head_ref: ${{ github.run_id }}-marketplace-smoke
          min_pr_confidence: "0.0"

      - name: Debug RCA artifacts
        if: always()
        run: |
          echo "classification=${{ steps.rca.outputs.classification }}"
          echo "confidence=${{ steps.rca.outputs.confidence }}"
          echo "pr_created=${{ steps.rca.outputs.pr_created }}"
          echo "pr_url=${{ steps.rca.outputs.pr_url }}"
          echo "pr_failure_reason=${{ steps.rca.outputs.pr_failure_reason }}"
          if [ -f artifacts/ci-rca-observability.json ]; then
            echo "----- artifacts/ci-rca-observability.json -----"
            cat artifacts/ci-rca-observability.json
          fi
          if [ -f artifacts/ci-rca.json ]; then
            echo "----- artifacts/ci-rca.json -----"
            cat artifacts/ci-rca.json
          fi

      - name: Upload RCA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-rootcause-marketplace-smoke-artifacts
          path: |
            artifacts/ci-rca.json
            artifacts/ci-rca.md
            artifacts/ci-rca-observability.json

      - name: Assert PR was created or reused
        run: |
          echo "classification=${{ steps.rca.outputs.classification }}"
          echo "confidence=${{ steps.rca.outputs.confidence }}"
          echo "pr_created=${{ steps.rca.outputs.pr_created }}"
          echo "pr_url=${{ steps.rca.outputs.pr_url }}"
          echo "pr_failure_reason=${{ steps.rca.outputs.pr_failure_reason }}"
          if [ "${{ steps.rca.outputs.pr_created }}" != "true" ]; then
            echo "Expected published action to create or reuse a fix PR; failure_reason=${{ steps.rca.outputs.pr_failure_reason }}"
            exit 1
          fi
          if [ -z "${{ steps.rca.outputs.pr_url }}" ]; then
            echo "Expected non-empty pr_url when pr_created=true."
            exit 1
          fi
          case "${{ steps.rca.outputs.pr_url }}" in
            https://github.com/${{ github.repository }}/pull/*) ;;
            *)
              echo "Expected PR URL in this repo, got: ${{ steps.rca.outputs.pr_url }}"
              exit 1
              ;;
          esac
