name: Smoke Test Publish Wrapper Regression RCA

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke-publish-wrapper-regression:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write synthetic publish-wrapper failure log
        run: |
          cat > publish-wrapper-regression.log <<'EOF'
          Run Sync wrapper repository
          build failed: command step exited with non-zero status
          /home/runner/work/_temp/script.sh: line 24: git: command not found: pussh
          Error: Process completed with exit code 127.
          EOF

      - name: Write synthetic diff with workflow typo
        run: |
          cat > publish-wrapper-regression.diff <<'EOF'
          diff --git a/.github/workflows/publish-wrapper.yml b/.github/workflows/publish-wrapper.yml
          index 1111111..2222222 100644
          --- a/.github/workflows/publish-wrapper.yml
          +++ b/.github/workflows/publish-wrapper.yml
          @@ -68,7 +68,7 @@ jobs:
                    echo "No wrapper file changes detected."
                  else
                    git commit -m "release(wrapper): sync from ci-rootcause ${TAG}"
          -         git push origin main
          +         git pussh origin main
                  fi
          EOF

      - name: Write smoke config
        run: |
          cat > .ci-rootcause-smoke-publish-wrapper.yml <<EOF
          repository: ${{ github.repository }}
          target_branch: ${{ github.ref_name }}
          run_id: marketplace-smoke-publish-wrapper-${{ github.run_id }}
          output_dir: artifacts
          log_path: publish-wrapper-regression.log
          diff_path: publish-wrapper-regression.diff
          EOF

      - name: Run published ci-rootcause action
        id: rca
        uses: ibrahim1023/ci-rootcause-action@v0
        with:
          github_token: ${{ github.token }}
          create_fix_pr: "false"
          post_pr_comment: "false"
          config_path: .ci-rootcause-smoke-publish-wrapper.yml
          min_pr_confidence: "0.0"

      - name: Upload RCA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-rootcause-publish-wrapper-regression-artifacts
          path: |
            artifacts/ci-rca.json
            artifacts/ci-rca.md
            artifacts/ci-rca-observability.json

      - name: Assert RCA classification and safe behavior
        run: |
          echo "classification=${{ steps.rca.outputs.classification }}"
          echo "confidence=${{ steps.rca.outputs.confidence }}"
          echo "primary_root_cause_title=${{ steps.rca.outputs.primary_root_cause_title }}"
          echo "pr_created=${{ steps.rca.outputs.pr_created }}"
          echo "pr_failure_reason_code=${{ steps.rca.outputs.pr_failure_reason_code }}"
          echo "pr_failure_reason=${{ steps.rca.outputs.pr_failure_reason }}"
          if [ "${{ steps.rca.outputs.classification }}" != "BUILD" ]; then
            echo "Expected BUILD classification for shell-command regression."
            exit 1
          fi
          if [ "${{ steps.rca.outputs.pr_created }}" != "false" ]; then
            echo "Expected pr_created=false in regression smoke."
            exit 1
          fi
          if [ "${{ steps.rca.outputs.pr_failure_reason_code }}" != "CREATE_FIX_PR_DISABLED" ]; then
            echo "Expected CREATE_FIX_PR_DISABLED reason code."
            exit 1
          fi
          if [ ! -f artifacts/ci-rca.json ] || [ ! -f artifacts/ci-rca.md ]; then
            echo "Expected ci-rca artifacts to exist."
            exit 1
          fi
