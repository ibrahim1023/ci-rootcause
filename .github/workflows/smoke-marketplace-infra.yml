name: Smoke Test Marketplace Action (Infra)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke-marketplace-infra:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write smoke config
        run: |
          cat > .ci-rootcause-smoke-infra.yml <<EOF
          repository: ${{ github.repository }}
          target_branch: ${{ github.ref_name }}
          run_id: marketplace-smoke-infra-${{ github.run_id }}
          output_dir: artifacts
          log_path: fixtures/ci-logs/github-actions-infra-timeout.log
          diff_path: fixtures/diffs/refactor-only.diff
          EOF

      - name: Run published ci-rootcause action
        id: rca
        uses: ibrahim1023/ci-rootcause-action@v0
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          INPUT_CREATE_FIX_PR: "false"
          INPUT_POST_PR_COMMENT: "false"
        with:
          github_token: ${{ github.token }}
          create_fix_pr: "false"
          post_pr_comment: "false"
          config_path: .ci-rootcause-smoke-infra.yml
          min_pr_confidence: "0.0"

      - name: Upload RCA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-rootcause-marketplace-smoke-infra-artifacts
          path: |
            artifacts/ci-rca.json
            artifacts/ci-rca.md
            artifacts/ci-rca-observability.json

      - name: Assert infra classification
        run: |
          echo "classification=${{ steps.rca.outputs.classification }}"
          echo "confidence=${{ steps.rca.outputs.confidence }}"
          echo "pr_created=${{ steps.rca.outputs.pr_created }}"
          echo "pr_failure_reason_code=${{ steps.rca.outputs.pr_failure_reason_code }}"
          echo "pr_failure_reason=${{ steps.rca.outputs.pr_failure_reason }}"
          if [ "${{ steps.rca.outputs.classification }}" != "INFRA" ]; then
            echo "Expected INFRA classification."
            exit 1
          fi
          if [ "${{ steps.rca.outputs.pr_created }}" != "false" ]; then
            echo "Expected pr_created=false for smoke run."
            exit 1
          fi
          if [ "${{ steps.rca.outputs.pr_failure_reason_code }}" != "CREATE_FIX_PR_DISABLED" ]; then
            echo "Expected CREATE_FIX_PR_DISABLED reason code."
            exit 1
          fi
          if [ ! -f artifacts/ci-rca.json ] || [ ! -f artifacts/ci-rca.md ]; then
            echo "Expected ci-rca artifacts to exist."
            exit 1
          fi
