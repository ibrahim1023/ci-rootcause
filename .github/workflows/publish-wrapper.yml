name: Publish Marketplace Wrapper

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish to wrapper (for example: v0.1.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync-wrapper:
    runs-on: ubuntu-latest
    env:
      WRAPPER_REPO: ibrahim1023/ci-rootcause-action
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *)
              echo "release_tag must start with 'v' (received: $TAG)"
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify source tag exists
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Source repository is missing expected tag: ${TAG}"
            exit 1
          fi

      - name: Sync wrapper repository
        env:
          WRAPPER_TOKEN: ${{ secrets.CI_ROOTCAUSE_ACTION_REPO_TOKEN }}
        run: |
          if [ -z "$WRAPPER_TOKEN" ]; then
            echo "Missing required secret: CI_ROOTCAUSE_ACTION_REPO_TOKEN"
            exit 1
          fi

          TAG="${{ steps.tag.outputs.tag }}"
          export TAG
          git config --global user.name "ci-rootcause release bot"
          git config --global user.email "ci-rootcause-release-bot@users.noreply.github.com"

          WORKDIR="$(mktemp -d)"
          git clone "https://x-access-token:${WRAPPER_TOKEN}@github.com/${WRAPPER_REPO}.git" "$WORKDIR/wrapper"

          rsync -av --delete src/ "$WORKDIR/wrapper/src/"
          rsync -av action.yml README.md requirements.txt "$WORKDIR/wrapper/"

          rm -rf "$WORKDIR/wrapper/.github/workflows"

          cd "$WORKDIR/wrapper"
          git add -A
          if git diff --cached --quiet; then
            echo "No wrapper file changes detected."
          else
            git commit -m "release(wrapper): sync from ci-rootcause ${TAG}"
            git push origin main
          fi

          git tag -f "$TAG"
          git tag -f v0 "$TAG"
          git push origin "refs/tags/$TAG" --force
          git push origin refs/tags/v0 --force

          TAG_SHA="$(git rev-parse "$TAG^{commit}")"
          V0_SHA="$(git rev-parse "v0^{commit}")"
          if [ "$TAG_SHA" != "$V0_SHA" ]; then
            echo "Wrapper tag mismatch: v0 does not point to ${TAG}"
            exit 1
          fi

      - name: Create or update wrapper release
        env:
          WRAPPER_TOKEN: ${{ secrets.CI_ROOTCAUSE_ACTION_REPO_TOKEN }}
        run: |
          if [ -z "$WRAPPER_TOKEN" ]; then
            echo "Missing required secret: CI_ROOTCAUSE_ACTION_REPO_TOKEN"
            exit 1
          fi

          TAG="${{ steps.tag.outputs.tag }}"
          export TAG
          API_URL="https://api.github.com/repos/${WRAPPER_REPO}"
          AUTH_HEADER="Authorization: Bearer ${WRAPPER_TOKEN}"
          ACCEPT_HEADER="Accept: application/vnd.github+json"
          VERSION_HEADER="X-GitHub-Api-Version: 2022-11-28"

          STATUS="$(curl -sS -o release.json -w "%{http_code}" \
            -H "$AUTH_HEADER" \
            -H "$ACCEPT_HEADER" \
            -H "$VERSION_HEADER" \
            "${API_URL}/releases/tags/${TAG}")"

          if [ "$STATUS" = "200" ]; then
            RELEASE_ID="$(python -c "import json;print(json.load(open('release.json', encoding='utf-8'))['id'])")"

            curl -sS -X PATCH \
              -H "$AUTH_HEADER" \
              -H "$ACCEPT_HEADER" \
              -H "$VERSION_HEADER" \
              -H "Content-Type: application/json" \
              "${API_URL}/releases/${RELEASE_ID}" \
              -d "$(python -c "import json,os;tag=os.environ['TAG'];print(json.dumps({'tag_name':tag,'name':tag,'draft':False,'prerelease':False,'generate_release_notes':True}))")"
            echo "Updated wrapper release for ${TAG}"
          elif [ "$STATUS" = "404" ]; then
            curl -sS -X POST \
              -H "$AUTH_HEADER" \
              -H "$ACCEPT_HEADER" \
              -H "$VERSION_HEADER" \
              -H "Content-Type: application/json" \
              "${API_URL}/releases" \
              -d "$(python -c "import json,os;tag=os.environ['TAG'];print(json.dumps({'tag_name':tag,'name':tag,'draft':False,'prerelease':False,'generate_release_notes':True}))")"
            echo "Created wrapper release for ${TAG}"
          else
            echo "Unexpected response while looking up wrapper release (status=${STATUS})"
            cat release.json
            exit 1
          fi
