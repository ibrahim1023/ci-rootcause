name: app-failure-fixtures

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Failure scenario to trigger for GitHub App testing"
        required: true
        default: "typecheck"
        type: choice
        options:
          - typecheck
          - syntax
          - dependency
          - infra

permissions:
  contents: read

jobs:
  trigger-failure:
    runs-on: ubuntu-latest
    env:
      SCENARIO: ${{ inputs.scenario }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install mypy

      - name: Trigger TYPECHECK failure
        if: ${{ env.SCENARIO == 'typecheck' }}
        run: |
          cat > app_failure_typecheck.py <<'PY'
          def needs_int(value: int) -> int:
              return value

          result: int = needs_int("7")
          print(result)
          PY
          mypy app_failure_typecheck.py

      - name: Trigger SYNTAX failure
        if: ${{ env.SCENARIO == 'syntax' }}
        run: |
          cat > app_failure_syntax.py <<'PY'
          def broken(:
              return 1
          PY
          python app_failure_syntax.py

      - name: Trigger DEPENDENCY failure
        if: ${{ env.SCENARIO == 'dependency' }}
        run: |
          python -m pip install this-package-should-never-exist-123456789

      - name: Trigger INFRA-like failure
        if: ${{ env.SCENARIO == 'infra' }}
        run: |
          echo "ERROR: connection reset by peer while contacting package mirror"
          exit 1
