name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest

  packaging-smoke:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: CLI help smoke test
        run: ci-rootcause --help

      - name: Agentic flag parity smoke test
        run: |
          ci-rootcause --help | grep -q -- "--mode"
          ci-rootcause --help | grep -q -- "--provider"
          ci-rootcause --help | grep -q -- "--provider-api-key"
          ci-rootcause --help | grep -q -- "--enable-agentic-full"

      - name: Fixture run smoke test
        run: |
          ci-rootcause \
            --log-path fixtures/ci-logs/github-actions-python-failure.log \
            --diff-path fixtures/diffs/refactor-only.diff \
            --output-dir artifacts/ci-smoke \
            --timestamp 2026-02-21T00:00:00Z \
            --commit abc123 \
            --run-id gha_ci_smoke_1 \
            --base-commit abc122 \
            --head-commit abc123 \
            --repository owner/repo \
            --mode agentic_assist \
            --provider local
          test -f artifacts/ci-smoke/ci-rca.json
          test -f artifacts/ci-smoke/ci-rca.md
